<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f1f1f4" />
    <meta
      name="description"
      content="ورنت — بازارچه تلگرامی اکانت‌های دیجیتال و آی‌پی ثابت (VPN)."
    />
    <title>ورنت | اکانت‌های دیجیتال و آی‌پی ثابت</title>

    <!-- Vazirmatn — modern Persian (fa-IR) UI typeface -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!--
      Official Telegram WebApp SDK script. It defines window.Telegram.WebApp,
      which @twa-dev/sdk binds to on import. It must load before the app bundle.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!--
      Offline / desktop-browser fallback: if the Telegram script above cannot
      load (no internet, normal browser, CI preview) a minimal shim keeps
      `npm run dev` fully functional. Inside Telegram the real object wins.
    -->
    <script>
      if (!window.Telegram || !window.Telegram.WebApp) {
        window.Telegram = window.Telegram || {}
        window.Telegram.WebApp = {
          initData: '',
          initDataUnsafe: {},
          version: '8.0',
          platform: 'web',
          colorScheme:
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light',
          themeParams: {},
          viewportHeight: window.innerHeight,
          isExpanded: false,
          ready: function () {},
          expand: function () {},
          close: function () {},
          onEvent: function () {},
          offEvent: function () {},
          setHeaderColor: function () {},
          setBackgroundColor: function () {},
          setBottomBarColor: function () {},
          disableVerticalSwipes: function () {},
          HapticFeedback: {
            impactOccurred: function () {},
            notificationOccurred: function () {},
            selectionChanged: function () {}
          }
        }
      }
    </script>

    <!--
      Theme bootstrap — runs before the bundle so the first paint already has
      the right palette and no light/dark flash. Inside Telegram the client's
      colorScheme wins; in a browser the admin preference (if any) is used.
    -->
    <script>
      (function () {
        try {
          var webApp = window.Telegram && window.Telegram.WebApp
          var inTelegram = !!(webApp && (webApp.initData || (webApp.initDataUnsafe && webApp.initDataUnsafe.user)))
          var stored = localStorage.getItem('varnet.admin.theme')
          var system = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = inTelegram
            ? webApp.colorScheme === 'dark'
              ? 'dark'
              : 'light'
            : stored === 'light' || stored === 'dark'
              ? stored
              : system
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#17212b' : '#f1f1f4')
        } catch (error) {
          /* localStorage may be unavailable — the CSS default (light) applies. */
        }
      })()
    </script>
  </head>
  <body dir="rtl">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
