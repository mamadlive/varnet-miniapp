name = "varnet-miniapp"
pages_build_output_dir = "dist"
compatibility_date = "2024-03-20"

# Purchase cycle storage (users / orders / wallet_transactions).
#
# One-time setup:
#   1. wrangler d1 create varnet
#   2. paste the returned database_id below (replacing the placeholder)
#   3. wrangler d1 migrations apply varnet --remote
#   4. wrangler pages secret put TELEGRAM_BOT_TOKEN
#
# Until the real id is in place, `wrangler pages deploy` refuses to run.
[[d1_databases]]
binding = "DB"
database_name = "varnet"
database_id = "22c6204b-9d0d-4098-b47f-ef767c0ab5c3"
migrations_dir = "migrations"
